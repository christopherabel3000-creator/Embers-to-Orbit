<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Embers to Orbit: an accessible strategy game. Lead a handful of survivors from a campfire to the stars.">
  <meta name="theme-color" content="#1c1712">
  <title>Embers to Orbit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <p class="game-name">Embers to Orbit</p>
    <p id="status" class="status"></p>
  </header>
  <nav id="nav" aria-label="Camp" hidden></nav>
  <main id="main" tabindex="-1">
    <noscript><p>Embers to Orbit needs JavaScript to run.</p></noscript>
  </main>
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
